<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" role="img" aria-label="Legislación FP">
  <!-- La marca del sitio: la regla de margen de la que cuelga el texto. Solo
       negro y blanco, y se invierte con el tema del navegador. -->
  <style>
    .papel { fill: #ffffff; }
    .tinta { fill: #000000; }
    @media (prefers-color-scheme: dark) {
      .papel { fill: #000000; }
      .tinta { fill: #ffffff; }
    }
  </style>
  <rect class="papel" width="32" height="32"/>
  <rect class="tinta" x="4" y="4" width="4" height="24"/>
  <rect class="tinta" x="12" y="6" width="16" height="3"/>
  <rect class="tinta" x="12" y="13" width="16" height="3"/>
  <rect class="tinta" x="12" y="20" width="10" height="3"/>
</svg>
